<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="آموزش انیمیشنی ضرب ماتریس‌ها همراه با آزمون">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%E2%9C%96%EF%B8%8F%3C/text%3E%3C/svg%3E">
    <title>آموزش انیمیشنی ضرب ماتریس‌ها</title>
    <style>
        /* ==========================================
           فونت و استایل‌های پایه
           ========================================== */
        

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Vazirmatn', 'Tahoma', 'Segoe UI', sans-serif;
            user-select: none;
        }

        body {
            background-color: #0f172a; /* آبی تیره */
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 10px;
            color: #334155;
            transition: background-color 0.5s ease;
            position: relative;
            overflow-x: hidden;
        }

        body.quiz-mode {
            background-color: #4a0e17; /* آلبالویی تیره */
        }

        /* ==========================================
           استیکرهای ضرب شناور در پس‌زمینه
           ========================================== */
        .floating-stickers {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .floating-sticker {
            position: absolute;
            color: rgba(255, 255, 255, 0.07);
            font-size: 3rem;
            font-weight: bold;
            animation: floatAround 12s linear infinite;
        }

        .quiz-mode .floating-sticker {
            color: rgba(255, 255, 255, 0.04);
        }

        @keyframes floatAround {
            0% {
                transform: translateY(105vh) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-10vh) rotate(360deg);
                opacity: 0;
            }
        }

        /* Container اصلی SPA */
        .app-container {
            width: 100%;
            max-width: 950px;
            background-color: #ffffff;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            padding: 20px 15px;
            position: relative;
            z-index: 10;
            overflow: hidden;
            min-height: 580px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* Header */
        header h1 {
            text-align: center;
            font-size: 1.8rem;
            color: #1e293b;
            margin-bottom: 15px;
            font-weight: 800;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.05);
        }

        /* ==========================================
           تصویر تزئینی صفحه اصلی
           ========================================== */
        .hero-image {
            width: 100%;
            display: flex;
            justify-content: center;
            margin-bottom: 14px;
            pointer-events: none; /* روی دکمه‌ها اثری ندارد */
        }

        .hero-image img {
            width: 100%;
            max-width: 560px;
            max-height: 240px;
            object-fit: contain;
            border-radius: 16px;
            box-shadow: 0 6px 18px rgba(15, 23, 42, 0.25);
            -webkit-user-drag: none;
        }

        /* در حالت آزمون تصویر نمایش داده نمی‌شود */
        .quiz-mode .hero-image {
            display: none;
        }

        /* دکمه‌ها و استایل‌های طیف آبی */
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            margin-bottom: 15px;
        }

        .btn, .select-btn {
            color: white;
            border: none;
            padding: 9px 15px;
            font-size: 0.9rem;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.15s ease;
            position: relative;
            top: 0;
            outline: none;
        }

        /* طیف‌های مختلف آبی برای دکمه‌ها */
        .btn-blue-1 {
            background: linear-gradient(145deg, #2563eb, #1d4ed8);
            box-shadow: 0 4px 0 #1e40af, 0 6px 10px rgba(0,0,0,0.15);
        }
        .btn-blue-2 {
            background: linear-gradient(145deg, #0284c7, #0369a1);
            box-shadow: 0 4px 0 #075985, 0 6px 10px rgba(0,0,0,0.15);
        }
        .btn-blue-3 {
            background: linear-gradient(145deg, #4f46e5, #3730a3);
            box-shadow: 0 4px 0 #312e81, 0 6px 10px rgba(0,0,0,0.15);
        }
        .btn-blue-4 {
            background: linear-gradient(145deg, #0ea5e9, #0284c7);
            box-shadow: 0 4px 0 #0369a1, 0 6px 10px rgba(0,0,0,0.15);
        }
        .btn-blue-5 {
            background: linear-gradient(145deg, #1e40af, #1e3a8a);
            box-shadow: 0 4px 0 #172554, 0 6px 10px rgba(0,0,0,0.15);
        }
        .select-btn {
            background: linear-gradient(145deg, #0284c7, #0369a1);
            box-shadow: 0 4px 0 #075985, 0 6px 10px rgba(0,0,0,0.15);
            appearance: none;
            -webkit-appearance: none;
            -moz-appearance: none;
            text-align: center;
            padding-left: 20px;
            padding-right: 20px;
        }

        .btn:hover, .select-btn:hover {
            transform: translateY(-2px);
            filter: brightness(1.1);
        }

        .btn:active, .btn.clicked {
            background: linear-gradient(145deg, #f97316, #c2410c) !important;
            box-shadow: 0 2px 0 #9a3412, 0 4px 6px rgba(0, 0, 0, 0.2) !important;
            transform: translateY(3px) !important;
        }

        .quiz-mode .btn, .quiz-mode .select-btn {
            background: linear-gradient(145deg, #6b7280, #4b5563);
            border: 2px solid #ffffff;
            box-shadow: 0 4px 0 #374151, 0 6px 10px rgba(0, 0, 0, 0.25);
        }

        /* بخش نمایش ماتریس‌ها */
        .workspace {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            flex-grow: 1;
            width: 100%;
        }

        .matrices-container {
            display: flex;
            direction: ltr; /* A × B = C */
            align-items: center;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
            width: 100%;
            min-height: 140px;
            padding: 5px;
        }

        .matrix-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex-shrink: 0;
        }

        .matrix-title {
            font-weight: bold;
            margin-bottom: 4px;
            color: #475569;
            direction: rtl;
            font-size: 0.85rem;
        }

        .matrix-grid {
            display: grid;
            gap: 4px;
            padding: 6px 8px;
            border-left: 3px solid #334155;
            border-right: 3px solid #334155;
            border-radius: 8px;
            background-color: #f8fafc;
            position: relative;
            transition: all 0.3s ease;
        }

        .matrix-cell {
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #ffffff;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            direction: ltr;
        }

        /* ==========================================
           پالت رنگی
           ========================================== */
        .cell-highlight-row {
            background-color: #fef08a !important; 
            border-color: #eab308 !important;
            color: #854d0e;
            transform: scale(1.04);
        }

        .cell-highlight-col {
            background-color: #bae6fd !important; 
            border-color: #0284c7 !important;
            color: #0369a1;
            transform: scale(1.04);
        }

        .cell-active-pair {
            background-color: #e9d5ff !important; 
            border-color: #a855f7 !important;
            color: #6b21a8;
            transform: scale(1.1);
            box-shadow: 0 0 8px rgba(168, 85, 247, 0.4);
            animation: pulse 0.6s infinite alternate;
        }

        .cell-target {
            background-color: #fbcfe8 !important; 
            border-color: #ec4899 !important;
            color: #9d174d;
            transform: scale(1.06);
        }

        .cell-completed {
            background-color: #f3e8ff !important;
            border-color: #c084fc !important;
            color: #581c87 !important;
        }

        @keyframes pulse {
            0% { transform: scale(1.02); }
            100% { transform: scale(1.1); }
        }

        /* پیام خطا */
        .error-message {
            color: #dc2626;
            font-size: 1rem;
            font-weight: bold;
            text-align: center;
            margin: 5px 0;
            padding: 10px;
            background-color: #fef2f2;
            border: 2px dashed #ef4444;
            border-radius: 12px;
            animation: fadeIn 0.5s ease-in;
            line-height: 1.5;
        }

        /* پنل فرمول‌ها و محاسبات */
        .formula-panel {
            width: 100%;
            background-color: #f8fafc;
            border: 2px solid #e2e8f0;
            border-radius: 14px;
            padding: 12px;
            min-height: 90px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            justify-content: center;
            gap: 8px;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.03);
            direction: ltr;
            text-align: left;
            overflow-x: auto;
        }

        .math-display {
            font-size: 1.15rem;
            overflow-x: auto;
            max-width: 100%;
            padding: 2px;
            text-align: left;
            direction: ltr;
            color: #1e293b;
        }

        /* استایل‌های آزمون */
        .quiz-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            width: 100%;
        }

        .quiz-options {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            width: 100%;
            max-width: 600px;
            margin-top: 5px;
        }

        .option-btn {
            background: #ffffff;
            border: 2px solid #cbd5e1;
            padding: 8px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            overflow-x: auto;
        }

        .option-btn:hover {
            border-color: #ec4899;
            background-color: #fdf2f8;
            transform: translateY(-2px);
        }

        /* انیمیشن باران ستاره */
        .star {
            position: fixed;
            top: -20px;
            color: #f59e0b;
            font-size: 24px;
            z-index: 1000;
            pointer-events: none;
            animation: fall linear forwards;
        }

        @keyframes fall {
            to {
                transform: translateY(105vh) rotate(360deg);
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        footer {
            margin-top: 15px;
            text-align: center;
            font-size: 0.95rem;
            color: #94a3b8;
            font-weight: bold;
            direction: rtl;
            z-index: 10;
        }

        @media (max-width: 640px) {
            body { padding: 8px 4px; }
            .app-container { padding: 12px 8px; border-radius: 15px; min-height: 500px; }
            header h1 { font-size: 1.3rem; margin-bottom: 10px; }
            .hero-image img { max-height: 170px; border-radius: 12px; }
            .controls { gap: 5px; }
            .btn, .select-btn { padding: 7px 10px; font-size: 0.78rem; border-radius: 8px; }
            .matrix-cell { width: 28px; height: 28px; font-size: 0.8rem; }
            .matrix-grid { padding: 4px 5px; gap: 3px; }
            .matrices-container { gap: 4px; }
            .quiz-options { grid-template-columns: 1fr; }
            .math-display { font-size: 0.95rem; }
            footer { font-size: 0.8rem; margin-top: 10px; }
        }
    </style>
</head>

        <div class="controls" id="main-controls">
            <button class="btn btn-blue-1" onclick="generateRandomMatrices()">انتخاب دو ماتریس تصادفی</button>
            
            <!-- دکمه کشویی انتخاب سرعت (جایگاه دوم) -->
            <select class="select-btn" id="speed-selector" onchange="updateSpeed()">
                <option value="" disabled selected hidden>انتخاب سرعت پخش انیمیشن</option>
                <option value="4000">خیلی کند (۴ ثانیه)</option>
                <option value="3000">کند (۳ ثانیه)</option>
                <option value="2000">متوسط (۲ ثانیه)</option>
                <option value="1000">تند (۱ ثانیه)</option>
                <option value="500">خیلی تند (۰.۵ ثانیه)</option>
            </select>

            <!-- دکمه مشاهده دوباره مراحل (جایگاه سوم) -->
            <button class="btn btn-blue-2" onclick="replayAnimation()">مشاهده دوباره مراحل</button>

            <button class="btn btn-blue-3" onclick="clearWorkspace()">پاک کردن</button>
            <button class="btn btn-blue-4" id="music-toggle-btn" onclick="toggleMusic()">پخش / توقف موسیقی</button>
            <button class="btn btn-blue-5" onclick="startQuiz()">آزمون</button>
        </div>

        <div class="workspace" id="workspace">
            <div id="error-box"></div>
            
            <div class="matrices-container" id="matrices-node"></div>

            <div class="formula-panel" id="formula-panel">
                <div class="math-display" id="math-step-1">
                    <math xmlns="http://www.w3.org/1998/Math/MathML" dir="rtl">
                        <mtext>برای شروع، روی «انتخاب دو ماتریس تصادفی» کلیک کنید.</mtext>
                    </math>
                </div>
                <div class="math-display" id="math-step-2"></div>
            </div>
        </div>
    </div>

    <footer>
        تهیه شده توسط اقدامی مقدم
    </footer>

    <audio id="bg-music" loop preload="none" playsinline src="https://mixkit.ir/wp-content/uploads/2022/03/XWorld-S2.mp3"></audio>

    <script>
        function createFloatingStickers() {
            const container = document.getElementById('sticker-container');
            const stickerCount = 15;
            for (let i = 0; i < stickerCount; i++) {
                const sticker = document.createElement('div');
                sticker.className = 'floating-sticker';
                sticker.innerText = '×';
                sticker.style.left = Math.random() * 95 + 'vw';
                sticker.style.animationDuration = (Math.random() * 8 + 8) + 's';
                sticker.style.animationDelay = (Math.random() * 5) + 's';
                sticker.style.fontSize = (Math.random() * 2 + 2) + 'rem';
                container.appendChild(sticker);
            }
        }
        createFloatingStickers();

        let matrixA = [];
        let matrixB = [];
        let matrixC = [];
        let isAnimating = false;
        let animationTimeout = null;
        let currentQuizStep = 0;
        let quizAnswers = [];
        let quizQuestions = [];
        let isMusicPlaying = false;
        let lastWasNotMultiplicable = false;
        
        // متغیر سرعت انیمیشن (پیش‌فرض: ۳۰۰۰ میلی‌ثانیه یا ۳ ثانیه)
        let animationDelay = 3000;

        function updateSpeed() {
            const selector = document.getElementById('speed-selector');
            if (selector.value) {
                animationDelay = parseInt(selector.value);
            }
        }

        const dingAudio = new Audio('https://assets.mixkit.co/active_storage/sfx/2000/2000-preview.mp3');

        function toPersianDigits(num) {
            if (num === null || num === undefined) return "";
            const persianDigits = ['۰', '۱', '۲', '۳', '۴', '۵', '۶', '۷', '۸', '۹'];
            return String(num).replace(/[0-9]/g, (w) => persianDigits[parseInt(w)]);
        }

        document.querySelectorAll('.btn').forEach(button => {
            button.addEventListener('click', function() {
                this.classList.add('clicked');
                setTimeout(() => this.classList.remove('clicked'), 300);
            });
        });

        function toggleMusic() {
            const music = document.getElementById('bg-music');
            const btn = document.getElementById('music-toggle-btn');
            
            if (isMusicPlaying) {
                music.pause();
                isMusicPlaying = false;
                btn.style.background = "";
            } else {
                music.play().then(() => {
                    isMusicPlaying = true;
                    btn.style.background = "linear-gradient(145deg, #10b981, #047857)";
                }).catch(() => console.log("خطا در پخش فایل صوتی"));
            }
        }

        function getRandomInt(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        function createRandomMatrix(rows, cols) {
            let matrix = [];
            for (let i = 0; i < rows; i++) {
                let row = [];
                for (let j = 0; j < cols; j++) {
                    row.push(getRandomInt(-10, 10));
                }
                matrix.push(row);
            }
            return matrix;
        }

        function generateRandomMatrices() {
            if (isAnimating) clearTimeout(animationTimeout);
            isAnimating = false;
            
            document.body.classList.remove('quiz-mode');
            document.getElementById('page-title').innerText = "ضرب ماتریس‌ها";
            document.getElementById('main-controls').style.display = "flex";

            let rA, cA, rB, cB;

            if (lastWasNotMultiplicable) {
                rA = getRandomInt(1, 4);
                cA = getRandomInt(1, 4);
                rB = cA;
                cB = getRandomInt(1, 4);
            } else {
                rA = getRandomInt(1, 4);
                cA = getRandomInt(1, 4);
                rB = getRandomInt(1, 4);
                cB = getRandomInt(1, 4);
            }

            matrixA = createRandomMatrix(rA, cA);
            matrixB = createRandomMatrix(rB, cB);

            renderAndCheck();
        }

        function renderAndCheck() {
            const errorBox = document.getElementById('error-box');
            const matricesNode = document.getElementById('matrices-node');
            const mathStep1 = document.getElementById('math-step-1');
            const mathStep2 = document.getElementById('math-step-2');

            errorBox.innerHTML = "";
            matricesNode.innerHTML = "";
            mathStep1.innerHTML = "";
            mathStep2.innerHTML = "";

            const colsA = matrixA[0].length;
            const rowsB = matrixB.length;

            matricesNode.appendChild(createMatrixDOM(matrixA, 'A'));
            
            let multiplySign = document.createElement('div');
            multiplySign.style.fontSize = '1.6rem';
            multiplySign.style.fontWeight = 'bold';
            multiplySign.style.color = '#0284c7';
            multiplySign.style.flexShrink = '0';
            multiplySign.innerText = '×';
            matricesNode.appendChild(multiplySign);

            matricesNode.appendChild(createMatrixDOM(matrixB, 'B'));

            if (colsA !== rowsB) {
                lastWasNotMultiplicable = true;

                errorBox.innerHTML = `<div class="error-message">
                    این دو ماتریس قابل ضرب نیستند.<br>
                    <span style="color:#1d4ed8; font-size:0.95rem;">لطفاً دو تا ماتریس دیگه انتخاب کن.</span>
                </div>`;
                mathStep1.innerHTML = `<math xmlns="http://www.w3.org/1998/Math/MathML" dir="rtl"><mtext>تعداد ستون‌های ماتریس اول (${toPersianDigits(colsA)}) با تعداد سطرهای ماتریس دوم (${toPersianDigits(rowsB)}) برابر نیست.</mtext></math>`;
                return;
            }

            lastWasNotMultiplicable = false;

            let equalSign = document.createElement('div');
            equalSign.style.fontSize = '1.6rem';
            equalSign.style.fontWeight = 'bold';
            equalSign.style.color = '#0284c7';
            equalSign.style.flexShrink = '0';
            equalSign.innerText = '=';
            matricesNode.appendChild(equalSign);

            const rowsA = matrixA.length;
            const colsB = matrixB[0].length;
            matrixC = Array(rowsA).fill(null).map(() => Array(colsB).fill("؟"));

            matricesNode.appendChild(createMatrixDOM(matrixC, 'C'));

            // پیام راهنما در زمان مکث اولیه
            mathStep1.innerHTML = `<math xmlns="http://www.w3.org/1998/Math/MathML" dir="rtl"><mtext>ماتریس‌ها آماده ضرب هستند...</mtext></math>`;

            // مکث ۲ ثانیه‌ای قبل از شروع انیمیشن و رنگ‌آمیزی
            if (isAnimating) clearTimeout(animationTimeout);
            isAnimating = true;

            animationTimeout = setTimeout(() => {
                startMultiplicationAnimation();
            }, 2000); 
        }

        function createMatrixDOM(matrix, name) {
            const wrapper = document.createElement('div');
            wrapper.className = 'matrix-wrapper';

            const title = document.createElement('div');
            title.className = 'matrix-title';
            const rowsP = toPersianDigits(matrix.length);
            const colsP = toPersianDigits(matrix[0].length);
            title.innerText = name ? `ماتریس ${name} (${rowsP}×${colsP})` : `(${rowsP}×${colsP})`;
            wrapper.appendChild(title);

            const grid = document.createElement('div');
            grid.className = 'matrix-grid';
            grid.id = name ? `matrix-${name}` : '';
            grid.style.gridTemplateColumns = `repeat(${matrix[0].length}, 1fr)`;

            for (let i = 0; i < matrix.length; i++) {
                for (let j = 0; j < matrix[0].length; j++) {
                    const cell = document.createElement('div');
                    cell.className = 'matrix-cell';
                    if (name) cell.id = `cell-${name}-${i}-${j}`;
                    
                    let val = matrix[i][j];
                    cell.innerText = typeof val === 'number' ? toPersianDigits(val) : val;
                    grid.appendChild(cell);
                }
            }

            wrapper.appendChild(grid);
            return wrapper;
        }

        function startMultiplicationAnimation() {
            const rowsA = matrixA.length;
            const colsA = matrixA[0].length;
            const colsB = matrixB[0].length;

            let steps = [];
            for (let i = 0; i < rowsA; i++) {
                for (let j = 0; j < colsB; j++) {
                    steps.push({ row: i, col: j });
                }
            }

            let currentStepIdx = 0;

            function runStep() {
                if (!isAnimating || currentStepIdx >= steps.length) {
                    isAnimating = false;
                    return;
                }

                const { row, col } = steps[currentStepIdx];
                clearHighlights();

                highlightRow('A', row, matrixA[0].length);
                highlightCol('B', col, matrixB.length, matrixB[0].length);
                
                const targetCell = document.getElementById(`cell-C-${row}-${col}`);
                if (targetCell) targetCell.classList.add('cell-target');

                let terms = [];
                let calcSumArr = [];
                let sumVal = 0;

                for (let k = 0; k < colsA; k++) {
                    let valA = matrixA[row][k];
                    let valB = matrixB[k][col];
                    let prod = valA * valB;
                    sumVal += prod;

                    let strA = valA < 0 ? `(${toPersianDigits(valA)})` : `${toPersianDigits(valA)}`;
                    let strB = valB < 0 ? `(${toPersianDigits(valB)})` : `${toPersianDigits(valB)}`;
                    terms.push(`${strA} × ${strB}`);
                    
                    let prodStr = prod < 0 ? `(${toPersianDigits(prod)})` : `${toPersianDigits(prod)}`;
                    calcSumArr.push(prodStr);
                }

                const mathStep1 = document.getElementById('math-step-1');
                const mathStep2 = document.getElementById('math-step-2');

                let rowP = toPersianDigits(row + 1);
                let colP = toPersianDigits(col + 1);

                let mathML1 = `<math xmlns="http://www.w3.org/1998/Math/MathML" dir="ltr">
                    <msub><mi>C</mi><mrow><mn>${rowP}</mn><mn>${colP}</mn></mrow></msub>
                    <mo>=</mo>
                    ${terms.map(t => `<mtext>${t}</mtext>`).join('<mo>+</mo>')}
                </math>`;
                
                mathStep1.innerHTML = mathML1;
                mathStep2.innerHTML = "";

                let kIdx = 0;
                function animatePairs() {
                    if (kIdx < colsA) {
                        document.querySelectorAll('.cell-active-pair').forEach(el => el.classList.remove('cell-active-pair'));

                        let cellA = document.getElementById(`cell-A-${row}-${kIdx}`);
                        let cellB = document.getElementById(`cell-B-${kIdx}-${col}`);
                        if (cellA) cellA.classList.add('cell-active-pair');
                        if (cellB) cellB.classList.add('cell-active-pair');

                        kIdx++;
                        animationTimeout = setTimeout(animatePairs, animationDelay);
                    } else {
                        let mathML2 = `<math xmlns="http://www.w3.org/1998/Math/MathML" dir="ltr">
                            <mo>=</mo>
                            ${calcSumArr.map(p => `<mtext>${p}</mtext>`).join('<mo>+</mo>')}
                            <mo>=</mo>
                            <mn>${toPersianDigits(sumVal)}</mn>
                        </math>`;
                        
                        mathStep2.innerHTML = mathML2;

                        matrixC[row][col] = sumVal;
                        if (targetCell) {
                            targetCell.innerText = toPersianDigits(sumVal);
                            targetCell.classList.remove('cell-target');
                            targetCell.classList.add('cell-completed');
                        }

                        currentStepIdx++;
                        animationTimeout = setTimeout(runStep, animationDelay);
                    }
                }

                animatePairs();
            }

            runStep();
        }

        function clearHighlights() {
            document.querySelectorAll('.matrix-cell').forEach(cell => {
                cell.classList.remove('cell-highlight-row', 'cell-highlight-col', 'cell-active-pair', 'cell-target');
            });
        }

        function highlightRow(matrixName, rowIndex, cols) {
            for (let j = 0; j < cols; j++) {
                let cell = document.getElementById(`cell-${matrixName}-${rowIndex}-${j}`);
                if (cell) cell.classList.add('cell-highlight-row');
            }
        }

        function highlightCol(matrixName, colIndex, rows, colsCount) {
            for (let i = 0; i < rows; i++) {
                let cell = document.getElementById(`cell-${matrixName}-${i}-${colIndex}`);
                if (cell) cell.classList.add('cell-highlight-col');
            }
        }

        function clearWorkspace() {
            if (isAnimating) clearTimeout(animationTimeout);
            isAnimating = false;
            matrixA = [];
            matrixB = [];
            matrixC = [];
            document.getElementById('error-box').innerHTML = "";
            document.getElementById('matrices-node').innerHTML = "";
            document.getElementById('math-step-1').innerHTML = `<math xmlns="http://www.w3.org/1998/Math/MathML" dir="rtl"><mtext>صفحه پاکسازی شد.</mtext></math>`;
            document.getElementById('math-step-2').innerHTML = "";
        }

        function replayAnimation() {
            if (matrixA.length === 0 || matrixB.length === 0) return;
            renderAndCheck();
        }

        function startQuiz() {
            if (isAnimating) clearTimeout(animationTimeout);
            isAnimating = false;

            document.body.classList.add('quiz-mode');
            document.getElementById('page-title').innerText = "آزمون ضرب ماتریس‌ها";
            document.getElementById('main-controls').style.display = "none";

            currentQuizStep = 0;
            quizAnswers = [];
            quizQuestions = generateQuizQuestions();

            renderQuizQuestion();
        }

        function generateQuizQuestions() {
            let questions = [];
            for (let q = 0; q < 3; q++) {
                let rA = getRandomInt(1, 3);
                let cA = getRandomInt(1, 3);
                let rB = cA;
                let cB = getRandomInt(1, 3);

                let mA = createRandomMatrix(rA, cA);
                let mB = createRandomMatrix(rB, cB);
                let mC = multiplyMatrices(mA, mB);

                let options = [mC];
                while (options.length < 4) {
                    let fakeC = mC.map(row => row.map(val => val + getRandomInt(-5, 5)));
                    if (!options.some(opt => isSameMatrix(opt, fakeC))) {
                        options.push(fakeC);
                    }
                }

                options.sort(() => Math.random() - 0.5);

                questions.push({
                    mA: mA,
                    mB: mB,
                    correctC: mC,
                    options: options
                });
            }
            return questions;
        }

        function multiplyMatrices(A, B) {
            let rA = A.length, cA = A[0].length, cB = B[0].length;
            let C = Array(rA).fill(null).map(() => Array(cB).fill(0));
            for (let i = 0; i < rA; i++) {
                for (let j = 0; j < cB; j++) {
                    for (let k = 0; k < cA; k++) {
                        C[i][j] += A[i][k] * B[k][j];
                    }
                }
            }
            return C;
        }

        function isSameMatrix(m1, m2) {
            if (m1.length !== m2.length || m1[0].length !== m2[0].length) return false;
            for (let i = 0; i < m1.length; i++) {
                for (let j = 0; j < m1[0].length; j++) {
                    if (m1[i][j] !== m2[i][j]) return false;
                }
            }
            return true;
        }

        function renderQuizQuestion() {
            const workspace = document.getElementById('workspace');
            const qData = quizQuestions[currentQuizStep];

            workspace.innerHTML = `
                <div class="quiz-container">
                    <div style="display:flex; justify-content:space-between; width:100%; align-items:center;">
                        <h3>سؤال شماره ${toPersianDigits(currentQuizStep + 1)} از ${toPersianDigits(3)}</h3>
                        <button class="btn btn-blue-1" onclick="exitQuiz()">بازگشت به صفحه اول</button>
                    </div>

                    <p style="font-size:1rem; font-weight:bold;">حاصل ضرب دو ماتریس زیر کدام است؟</p>

                    <div class="matrices-container">
                        ${createMatrixDOM(qData.mA, 'A').outerHTML}
                        <div style="font-size:1.6rem; font-weight:bold; color:#0284c7; flex-shrink:0;">×</div>
                        ${createMatrixDOM(qData.mB, 'B').outerHTML}
                    </div>

                    <div class="quiz-options">
                        ${qData.options.map((opt, idx) => `
                            <div class="option-btn" onclick="selectAnswer(${idx})">
                                ${createMatrixDOM(opt, '').outerHTML}
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function selectAnswer(optionIdx) {
            const qData = quizQuestions[currentQuizStep];
            const selectedOpt = qData.options[optionIdx];
            
            const isCorrect = isSameMatrix(selectedOpt, qData.correctC);
            quizAnswers.push(isCorrect);

            currentQuizStep++;

            if (currentQuizStep < 3) {
                renderQuizQuestion();
            } else {
                renderQuizResultButton();
            }
        }

        function renderQuizResultButton() {
            const workspace = document.getElementById('workspace');
            workspace.innerHTML = `
                <div class="quiz-container" style="justify-content:center; padding: 30px 0;">
                    <h2>سؤالات به پایان رسید.</h2>
                    <button class="btn btn-blue-1" style="font-size:1.1rem; padding:10px 20px;" onclick="showQuizResults()">مشاهده نتیجه آزمون</button>
                    <br><br>
                    <button class="btn btn-blue-3" onclick="exitQuiz()">بازگشت به صفحه اول</button>
                </div>
            `;
        }

        function showQuizResults() {
            const workspace = document.getElementById('workspace');
            const correctCount = quizAnswers.filter(ans => ans === true).length;

            if (correctCount >= 2) {
                triggerStarRain();
                dingAudio.play().catch(() => {});

                workspace.innerHTML = `
                    <div class="quiz-container" style="text-align:center;">
                        <h2 style="color:#0284c7; font-size:1.6rem;">تبریک! شما آزمون را با موفقیت گذراندید.</h2>
                        <p style="font-size:1.05rem; margin:12px 0;">تعداد پاسخ‌های صحیح: ${toPersianDigits(correctCount)} از ${toPersianDigits(3)}</p>
                        <button class="btn btn-blue-1" onclick="exitQuiz()">بازگشت به صفحه اول</button>
                    </div>
                `;
            } else {
                workspace.innerHTML = `
                    <div class="quiz-container" style="text-align:center;">
                        <h2 style="color:#dc2626; font-size:1.4rem;">برای یادگیری بهتر، دوباره آموزش را مشاهده کنید.</h2>
                        <p style="font-size:1.05rem; margin:12px 0;">تعداد پاسخ‌های صحیح: ${toPersianDigits(correctCount)} از ${toPersianDigits(3)}</p>
                        <button class="btn btn-blue-1" onclick="exitQuiz()">بازگشت به صفحه اول</button>
                    </div>
                `;
            }
        }

        function exitQuiz() {
            document.body.classList.remove('quiz-mode');
            document.getElementById('page-title').innerText = "ضرب ماتریس‌ها";
            document.getElementById('main-controls').style.display = "flex";

            const workspace = document.getElementById('workspace');
            workspace.innerHTML = `
                <div id="error-box"></div>
                <div class="matrices-container" id="matrices-node"></div>
                <div class="formula-panel" id="formula-panel">
                    <div class="math-display" id="math-step-1">
                        <math xmlns="http://www.w3.org/1998/Math/MathML" dir="rtl">
                            <mtext>برای شروع، روی «انتخاب دو ماتریس تصادفی» کلیک کنید.</mtext>
                        </math>
                    </div>
                    <div class="math-display" id="math-step-2"></div>
                </div>
            `;

            clearWorkspace();
        }

        function triggerStarRain() {
            for (let i = 0; i < 40; i++) {
                setTimeout(() => {
                    const star = document.createElement('div');
                    star.className = 'star';
                    star.innerText = '⭐';
                    star.style.left = Math.random() * 100 + 'vw';
                    star.style.animationDuration = (Math.random() * 2 + 1.5) + 's';
                    star.style.fontSize = (Math.random() * 20 + 15) + 'px';
                    document.body.appendChild(star);

                    setTimeout(() => star.remove(), 3500);
                }, i * 100);
            }
        }
    </script>
</body>
</html>
